[package]
name = "gpui-mcp-html"
description = "Pure HTML authoring, live rendering, bindings, and scaffolding for GPUI MCP applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["runtime", "json", "ron"]
runtime = ["dep:gpui", "dep:gpui-component", "dep:gpui-mcp", "dep:htmlswap"]
dev-watch = ["runtime", "dep:notify", "ron"]
json = ["dep:serde_json"]
ron = ["dep:ron"]
visual-parity = [
    "runtime",
    "dep:anyhow",
    "dep:clap",
    "dep:gpui-mcp-capture",
    "dep:image",
    "gpui-mcp/test-support",
]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
gpui-mcp = { path = "../gpui-mcp", default-features = false, optional = true }
gpui-mcp-capture = { path = "../gpui-mcp-capture", optional = true }
htmlswap = { workspace = true, optional = true }
image = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[[bin]]
name = "gpui-mcp-html-visual"
path = "src/bin/visual.rs"
required-features = ["visual-parity"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-mcp = { path = "../gpui-mcp", default-features = false, features = ["test-support"] }
tempfile = "3.23.0"

[lints]
workspace = true
