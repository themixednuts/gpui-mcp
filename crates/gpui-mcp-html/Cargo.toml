[package]
name = "gpui-mcp-html"
description = "Pure HTML authoring, live rendering, bindings, and scaffolding for GPUI MCP applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["zed", "json", "ron"]
# The live renderer. It needs a GPUI backend: `zed` (the default) or `gpui-pre`
# (GPUI Kit). Select exactly one, as for gpui-mcp itself.
runtime = ["dep:gpui-mcp", "dep:htmlswap"]
zed = ["runtime", "dep:gpui", "gpui-mcp/zed"]
gpui-pre = ["runtime", "dep:gpui_pre", "gpui-mcp/gpui-pre"]
# GPUI test contexts for this crate's tests and for apps testing rendered HTML.
test-support = ["gpui?/test-support", "gpui_pre?/test-support", "gpui-mcp/test-support"]
dev-watch = ["runtime", "dep:notify", "ron"]
json = ["dep:serde_json"]
ron = ["dep:ron"]
visual-parity = [
    "zed",
    "dep:anyhow",
    "dep:clap",
    "dep:gpui-mcp-capture",
    "dep:gpui_platform",
    "dep:image",
    "gpui-mcp/test-support",
]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui_pre = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
gpui-mcp = { path = "../gpui-mcp", default-features = false, optional = true }
gpui-mcp-capture = { path = "../gpui-mcp-capture", optional = true }
htmlswap = { workspace = true, optional = true }
image = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[[bin]]
name = "gpui-mcp-html-visual"
path = "src/bin/visual.rs"
required-features = ["visual-parity"]

[dev-dependencies]
# Backend-neutral, so the tests run on whichever backend the features select.
gpui-mcp = { path = "../gpui-mcp", default-features = false, features = ["test-support"] }
tempfile = "3.23.0"

[lints]
workspace = true
