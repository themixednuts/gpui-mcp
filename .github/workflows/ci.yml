name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run. Pushes to main and
# scheduled runs each get their own group so main's results are never lost.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-dev pkg-config cmake \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev libegl-dev libgbm-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-composite0-dev libpipewire-0.3-dev libdbus-1-dev libegl1-mesa-dev \
            mesa-vulkan-drivers openbox xvfb

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt && rustup default 1.96.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install visual parity dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked

      - name: Check screenshot-free integration
        run: cargo check -p gpui-mcp --no-default-features --features zed --locked

      - name: Build integration test fixture
        run: cargo build -p gpui-mcp-demo --locked

      - name: Test workspace
        run: cargo test --workspace --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked

      - name: Test Chromium/GPUI visual parity
        if: runner.os != 'Linux'
        run: npm run test:visual

      - name: Test Chromium/GPUI visual parity under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a bash visual-tests/run-xvfb.sh
        env:
          WAYLAND_DISPLAY: ""

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features gpui-mcp/test-support,gpui-mcp-html/dev-watch,gpui-mcp-html/visual-parity --locked -- -D warnings

      - name: Check gpui-pre integration
        run: cargo check -p gpui-mcp --no-default-features --features gpui-pre --locked

      - name: Test bridge with gpui-pre
        run: cargo test -p gpui-mcp --no-default-features --features gpui-pre,test-support --locked

      - name: Test HTML runtime and view transitions with gpui-pre
        run: cargo test -p gpui-mcp-html -p gpui-view-transitions --no-default-features --features gpui-mcp-html/gpui-pre,gpui-mcp-html/json,gpui-mcp-html/ron,gpui-mcp-html/dev-watch --locked

      - name: Clippy HTML runtime and view transitions with gpui-pre
        run: cargo clippy -p gpui-mcp-html -p gpui-view-transitions --all-targets --no-default-features --features gpui-mcp-html/gpui-pre,gpui-mcp-html/json,gpui-mcp-html/ron,gpui-mcp-html/dev-watch --locked -- -D warnings

      - name: Check GPUI Kit example formatting
        run: cargo fmt --manifest-path examples/gpui-kit/Cargo.toml -- --check

      - name: Check GPUI Kit integration
        run: cargo check --manifest-path examples/gpui-kit/Cargo.toml --all-targets --locked

      - name: Test GPUI Kit controls and input
        run: cargo test --manifest-path examples/gpui-kit/Cargo.toml --locked

      - name: Clippy GPUI Kit bridge
        run: cargo clippy -p gpui-mcp --all-targets --no-default-features --features gpui-pre,test-support --locked -- -D warnings

      - name: Check gpui-ce integration
        run: cargo check -p gpui-mcp --no-default-features --features gpui-ce --locked

      - name: Test bridge with gpui-ce
        run: cargo test -p gpui-mcp --no-default-features --features gpui-ce,test-support,gpui_ce/test-support --locked

      - name: Clippy gpui-ce bridge
        run: cargo clippy -p gpui-mcp --all-targets --no-default-features --features gpui-ce,test-support,gpui_ce/test-support --locked -- -D warnings

      - name: Upload visual parity failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-parity-${{ matrix.os }}
          path: visual-tests/artifacts
          if-no-files-found: ignore

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  vendor:
    name: Reproduce vendored GPUI crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: xtask

      - run: cargo xtask vendor --crate gpui-pre --check
      - run: cargo xtask vendor --crate gpui-ce --check

  patch-series:
    # The main matrix builds the bridge against the vendored releases. This job
    # applies each other supported release's patch series to its crates.io
    # archive and builds and tests the bridge against the result, so a patch
    # that stops applying or compiling fails here rather than downstream.
    # The bridge feature for each crate has the crate's name.
    name: ${{ matrix.crate }} ${{ matrix.version }}${{ matrix.without && format(' without {0}', matrix.without) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: gpui-pre
            version: 0.3.5
          - crate: gpui-pre
            version: 0.3.6
          # The optional patches must stay independent of the automation patch.
          - crate: gpui-pre
            version: 0.3.7
            without: font-fallback
          - crate: gpui-pre
            version: 0.3.7
            without: grid
          - crate: gpui-ce
            version: 0.2.2
            without: font-fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-dev pkg-config cmake \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev libegl-dev libgbm-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-composite0-dev libpipewire-0.3-dev libdbus-1-dev libegl1-mesa-dev \
            mesa-vulkan-drivers

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy && rustup default 1.96.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.crate }}-${{ matrix.version }}-${{ matrix.without }}

      - name: Apply the patch series
        env:
          CRATE: ${{ matrix.crate }}
          VERSION: ${{ matrix.version }}
          WITHOUT: ${{ matrix.without }}
        run: >-
          cargo xtask vendor --crate "$CRATE" --version "$VERSION"
          --output "$RUNNER_TEMP/$CRATE"
          ${WITHOUT:+--without "$WITHOUT"}

      # The committed lockfile resolves the newest releases. For an older
      # gpui-pre, move GPUI Kit's base layer to the oldest release the
      # workspace accepts (it accepts every gpui-pre the bridge does), then
      # select the patched release.
      - name: Resolve the patched release
        if: matrix.crate == 'gpui-pre'
        env:
          CRATE: ${{ matrix.crate }}
          VERSION: ${{ matrix.version }}
        run: |
          base=$(sed -n 's/^gpui-base = { version = ">=\([0-9.]*\),.*/\1/p' Cargo.toml)
          patch="patch.crates-io.$CRATE.path='$RUNNER_TEMP/$CRATE'"
          cargo update -p gpui-base --precise "$base" --config "$patch"
          cargo update -p "$CRATE" --precise "$VERSION" --config "$patch"

      # The committed lockfile names the vendored release, so these steps
      # resolve the patched release instead of using --locked.
      # The bridge's unit tests need the GPUI crate's own test support, which
      # its test-support feature doesn't turn on for gpui-ce.
      - name: Test bridge
        env:
          CRATE: ${{ matrix.crate }}
        run: >-
          cargo test -p gpui-mcp --no-default-features
          --features "$CRATE,test-support,${CRATE//-/_}/test-support"
          --config "patch.crates-io.$CRATE.path='$RUNNER_TEMP/$CRATE'"

      - name: Check that the bridge resolved the patched release
        env:
          CRATE: ${{ matrix.crate }}
          VERSION: ${{ matrix.version }}
        run: >-
          cargo tree -p gpui-mcp --no-default-features --features "$CRATE"
          --config "patch.crates-io.$CRATE.path='$RUNNER_TEMP/$CRATE'"
          --depth 1 --prefix none | grep -Fx "$CRATE v$VERSION ($RUNNER_TEMP/$CRATE)"

      - name: Clippy
        env:
          CRATE: ${{ matrix.crate }}
        run: >-
          cargo clippy -p gpui-mcp --all-targets --no-default-features
          --features "$CRATE,test-support,${CRATE//-/_}/test-support"
          --config "patch.crates-io.$CRATE.path='$RUNNER_TEMP/$CRATE'" -- -D warnings

      # The HTML runtime and view transitions support the same releases, with
      # GPUI Kit motion. The runtime needs every optional patch (grid layout),
      # so rows without one skip it.
      - name: Test HTML runtime and view transitions
        if: matrix.crate == 'gpui-pre' && !matrix.without
        run: >-
          cargo test -p gpui-mcp-html -p gpui-view-transitions --no-default-features
          --features "gpui-mcp-html/gpui-pre,gpui-mcp-html/json,gpui-mcp-html/ron,gpui-mcp-html/dev-watch"
          --config "patch.crates-io.gpui-pre.path='$RUNNER_TEMP/gpui-pre'"

      - name: Clippy HTML runtime and view transitions
        if: matrix.crate == 'gpui-pre' && !matrix.without
        run: >-
          cargo clippy -p gpui-mcp-html -p gpui-view-transitions --all-targets --no-default-features
          --features "gpui-mcp-html/gpui-pre,gpui-mcp-html/json,gpui-mcp-html/ron,gpui-mcp-html/dev-watch"
          --config "patch.crates-io.gpui-pre.path='$RUNNER_TEMP/gpui-pre'" -- -D warnings

  msrv:
    # gpui-mcp and gpui-mcp-protocol declare an older rust-version than the
    # workspace toolchain, because apps link them.
    name: Bridge on Rust 1.95
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-dev pkg-config cmake \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev libegl-dev libgbm-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-composite0-dev libpipewire-0.3-dev libdbus-1-dev libegl1-mesa-dev \
            mesa-vulkan-drivers

      # rust-toolchain.toml pins the workspace toolchain; `+1.95.0` overrides it.
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: msrv

      - name: Check the Zed backend
        run: cargo +1.95.0 check -p gpui-mcp --locked

      - name: Test the gpui-pre backend
        run: >-
          cargo +1.95.0 test -p gpui-mcp -p gpui-mcp-protocol --no-default-features
          --features gpui-mcp/gpui-pre,gpui-mcp/test-support --locked

      - name: Test the gpui-ce backend
        run: >-
          cargo +1.95.0 test -p gpui-mcp --no-default-features
          --features gpui-ce,test-support,gpui_ce/test-support --locked

  external-consumer:
    name: Public Git installation
    runs-on: ubuntu-24.04
    env:
      # Pull request runs check out a temporary merge commit that cannot be
      # fetched by revision, so install from the pull request head instead.
      REV: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-dev pkg-config cmake \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev libegl-dev libgbm-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinput-dev \
            libxcb-composite0-dev libpipewire-0.3-dev libdbus-1-dev libegl1-mesa-dev \
            mesa-vulkan-drivers

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install gpui-mcp from this Git commit
        env:
          INSTALL_ROOT: ${{ runner.temp }}/gpui-mcp-install
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          cargo install --git "$REPOSITORY_URL" --rev "$REV" --locked
          --root "$INSTALL_ROOT" gpui-mcp-server

      - name: Verify the installed MCP executable
        env:
          INSTALL_ROOT: ${{ runner.temp }}/gpui-mcp-install
        run: '"$INSTALL_ROOT/bin/gpui-mcp" --version'

      - name: Check external GPUI Kit consumer
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          cargo xtask check-consumer --backend gpui-kit
          --repository "$REPOSITORY_URL" --rev "$REV"
          --target-dir "$GITHUB_WORKSPACE/target"

      - name: Check external gpui-ce consumer
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          cargo xtask check-consumer --backend gpui-ce
          --repository "$REPOSITORY_URL" --rev "$REV"
          --target-dir "$GITHUB_WORKSPACE/target"
