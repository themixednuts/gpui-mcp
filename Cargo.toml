[workspace]
members = [
    "crates/gpui-mcp-capture",
    "crates/gpui-mcp-protocol",
    "crates/gpui-mcp",
    "crates/gpui-mcp-html",
    "crates/gpui-mcp-server",
    "examples/demo",
    "examples/runtime-showcase",
]
exclude = ["vendor/gpui"]
default-members = ["crates/gpui-mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/themixednuts/gpui-mcp"
homepage = "https://github.com/themixednuts/gpui-mcp"

[workspace.dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
gpui = "=0.2.2"
gpui-component = "0.5.1"
htmlswap = { git = "https://github.com/themixednuts/htmlswap", rev = "7b6bd0f0c73cef241819c707615684fd2c066341" }
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
notify = "8.2.0"
mp4 = "0.14.0"
openh264 = "0.9.7"
rand = "0.9.2"
ron = "0.12.2"
rmcp = { version = "3.1.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
xcap = { version = "0.9.8", features = ["wgc"] }
widestring = "1.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package.image]
opt-level = 2

[patch.crates-io]
# GPUI 0.2.2 does not yet expose the rendered semantic frame, direct text-input bridge, or
# native window identity needed by the MCP bridge. The vendored patch also contains three focused
# upstream fixes. See vendor/README.md for the exact scope and removal conditions.
gpui = { path = "vendor/gpui" }
